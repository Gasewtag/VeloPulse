services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velopulse_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "velopulse.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - PYTHONPATH=/app/src
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - STRAVA_MOCK_MODE=${STRAVA_MOCK_MODE:-true}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-mock_strava_client_id}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-mock_strava_client_secret}
      - STRAVA_VERIFY_TOKEN=${STRAVA_VERIFY_TOKEN:-velopulse_dev_verify_token_2026}
      - STRAVA_WEBHOOK_CALLBACK_URL=${STRAVA_WEBHOOK_CALLBACK_URL:-http://localhost:8000/api/v1/webhooks/strava}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - velopulse-network

  postgres:
    image: postgres:16-alpine
    container_name: velopulse_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - velopulse-network

  redis:
    image: redis:7-alpine
    container_name: velopulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - velopulse-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: velopulse_ngrok
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$NGROK_DOMAIN" ]; then
          exec ngrok http api:8000 --url "$$NGROK_DOMAIN" --log stdout
        else
          exec ngrok http api:8000 --log stdout
        fi
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
    ports:
      - "4040:4040"
    depends_on:
      - api
    networks:
      - velopulse-network
    profiles:
      - tunnel

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velopulse_worker
    restart: unless-stopped
    command: ["taskiq", "worker", "velopulse.tasks.broker:broker", "velopulse.tasks.activities"]
    healthcheck:
      disable: true
    environment:
      - PYTHONPATH=/app/src
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - STRAVA_MOCK_MODE=${STRAVA_MOCK_MODE:-true}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-mock_strava_client_id}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-mock_strava_client_secret}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - velopulse-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  velopulse-network:
    driver: bridge
