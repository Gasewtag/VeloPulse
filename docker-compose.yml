version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velopulse_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "velopulse.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=velopulse_user
      - POSTGRES_PASSWORD=velopulse_password
      - POSTGRES_DB=velopulse_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - velopulse-network

  postgres:
    image: postgres:16-alpine
    container_name: velopulse_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=velopulse_user
      - POSTGRES_PASSWORD=velopulse_password
      - POSTGRES_DB=velopulse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velopulse_user -d velopulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - velopulse-network

  redis:
    image: redis:7-alpine
    container_name: velopulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - velopulse-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  velopulse-network:
    driver: bridge
