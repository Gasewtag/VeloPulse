[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velopulse"
version = "0.1.0"
description = "Automated bicycle component wear tracker, maintenance scheduler, and cycling assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "VeloPulse Team", email = "engineering@velopulse.internal" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=0.5.0",
    "redis>=5.0.0",
    "aiogram>=3.7.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/velopulse"]

# ------------------------------------------------------------------------------
# Ruff Configuration
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (enforces modern 3.12 idioms)
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by ruff format)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["velopulse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------------------
# Mypy Configuration
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "pydantic_settings.*",
    "fastapi.*",
    "taskiq.*",
    "taskiq_redis.*",
    "testcontainers.*",
    "aiogram.*",
    "structlog.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["velopulse.core.config"]
disallow_subclassing_any = false

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ------------------------------------------------------------------------------
# Coverage Configuration
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/velopulse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
