name: VeloPulse CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build and quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Static Type Analysis
        run: mypy src

  test-and-coverage:
    name: Test Suite & Coverage Matrix
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velopulse_user
          POSTGRES_PASSWORD: velopulse_password
          POSTGRES_DB: velopulse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velopulse_user -d velopulse_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: src
      ENVIRONMENT: test
      DEBUG: "true"
      LOG_FORMAT: text
      SECRET_KEY: ci-test-secret-key-minimum-32-bytes-long-for-test
      ENCRYPTION_KEY: ""
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: velopulse_user
      POSTGRES_PASSWORD: velopulse_password
      POSTGRES_DB: velopulse_db
      REDIS_URL: redis://localhost:6379/0
      STRAVA_MOCK_MODE: "true"
      STRAVA_CLIENT_ID: mock_strava_client_id
      STRAVA_CLIENT_SECRET: mock_strava_client_secret
      STRAVA_VERIFY_TOKEN: velopulse_dev_verify_token_2026
      STRAVA_WEBHOOK_CALLBACK_URL: http://localhost:8000/api/v1/webhooks/strava
      TELEGRAM_BOT_TOKEN: "123456789:ABCDEF_mock_ci_telegram_token"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply Alembic Migrations
        run: alembic upgrade head

      - name: Execute Pytest with Coverage
        run: |
          pytest -v --cov=velopulse --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-production-verify:
    name: Production Container Security & Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          load: true
          tags: velopulse:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Non-Root User Execution
        run: |
          USER_ID=$(docker run --rm velopulse:prod id -u)
          GROUP_ID=$(docker run --rm velopulse:prod id -g)
          echo "Container runtime user: UID=$USER_ID, GID=$GROUP_ID"
          if [ "$USER_ID" -ne 10001 ]; then
            echo "Security Error: Container is not running as unprivileged appuser (10001)" >&2
            exit 1
          fi
